# E2E of the sync stack against a real Nextcloud (with the Notes app) in Docker. Not required
# for merge: it needs a ~3 minute server start and depends on the Nextcloud/Notes releases.
name: E2E

on:
  pull_request:
    paths:
      - "app/src/main/java/com/qtekfun/ultimatenotes/data/**"
      - "app/src/main/java/com/qtekfun/ultimatenotes/sync/**"
      - "app/src/test/java/com/qtekfun/ultimatenotes/e2e/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Start Nextcloud
        run: docker compose -f e2e/docker-compose.yml up -d

      - name: Install Notes and create an app password
        run: |
          e2e/setup.sh | tee /tmp/e2e-env > /dev/null
          # Keep the generated password out of the logs, then export it to the next steps.
          while read -r _ assignment; do
            name="${assignment%%=*}"
            value="${assignment#*=}"
            [ "$name" = NC_APP_PASSWORD ] && echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done < <(grep '^export ' /tmp/e2e-env)

      - name: E2E tests
        run: ./gradlew e2eTest

      - name: Collect Nextcloud logs
        if: failure()
        run: |
          docker logs ultimatenotes-e2e-nextcloud > nextcloud-container.log 2>&1 || true
          docker exec ultimatenotes-e2e-nextcloud sh -c 'cat /var/www/html/data/nextcloud.log' \
            > nextcloud.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            nextcloud-container.log
            nextcloud.log
            app/build/reports/tests/e2eTest/
            app/build/test-results/e2eTest/
          retention-days: 14

      - name: Stop Nextcloud
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
